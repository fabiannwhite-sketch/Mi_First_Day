<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e1f26;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .calculadora {
    width: 320px;
    background: #2b2d3a;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }
  .pantalla {
    background: #14151c;
    border-radius: 12px;
    padding: 20px 16px;
    margin-bottom: 16px;
    text-align: right;
    overflow: hidden;
  }
  .pantalla .previo {
    color: #8a8d9f;
    font-size: 14px;
    min-height: 18px;
    white-space: nowrap;
    overflow-x: auto;
  }
  .pantalla .actual {
    color: #ffffff;
    font-size: 36px;
    font-weight: 600;
    white-space: nowrap;
    overflow-x: auto;
  }
  .botones {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    border: none;
    border-radius: 12px;
    padding: 18px 0;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    background: #3a3d4d;
    color: #ffffff;
    transition: filter 0.15s ease;
  }
  button:hover { filter: brightness(1.15); }
  button:active { filter: brightness(0.9); }
  button.operador {
    background: #ff9f43;
    color: #1e1f26;
  }
  button.igual {
    background: #4ade80;
    color: #1e1f26;
    grid-column: span 2;
  }
  button.funcion {
    background: #565a6e;
  }
  button.cero {
    grid-column: span 2;
  }
</style>
</head>
<body>

<div class="calculadora">
  <div class="pantalla">
    <div class="previo" id="previo"></div>
    <div class="actual" id="actual">0</div>
  </div>
  <div class="botones">
    <button class="funcion" data-accion="limpiar">C</button>
    <button class="funcion" data-accion="borrar">⌫</button>
    <button class="funcion" data-accion="porcentaje">%</button>
    <button class="operador" data-operador="÷">÷</button>

    <button data-numero="7">7</button>
    <button data-numero="8">8</button>
    <button data-numero="9">9</button>
    <button class="operador" data-operador="×">×</button>

    <button data-numero="4">4</button>
    <button data-numero="5">5</button>
    <button data-numero="6">6</button>
    <button class="operador" data-operador="−">−</button>

    <button data-numero="1">1</button>
    <button data-numero="2">2</button>
    <button data-numero="3">3</button>
    <button class="operador" data-operador="+">+</button>

    <button class="cero" data-numero="0">0</button>
    <button data-numero=".">.</button>
    <button class="igual" data-accion="igual">=</button>
  </div>
</div>

<script>
  const pantallaActual = document.getElementById('actual');
  const pantallaPrevio = document.getElementById('previo');

  let actual = '0';
  let previo = '';
  let operador = null;
  let resultadoMostrado = false;

  function actualizarPantalla() {
    pantallaActual.textContent = actual;
    pantallaPrevio.textContent = previo && operador ? `${previo} ${operador}` : '';
  }

  function ingresarNumero(numero) {
    if (resultadoMostrado) {
      actual = numero === '.' ? '0.' : numero;
      resultadoMostrado = false;
      return;
    }
    if (numero === '.' && actual.includes('.')) return;
    if (actual === '0' && numero !== '.') {
      actual = numero;
    } else {
      actual += numero;
    }
  }

  function elegirOperador(nuevoOperador) {
    if (operador !== null && !resultadoMostrado) {
      calcular();
    }
    previo = actual;
    operador = nuevoOperador;
    actual = '0';
    resultadoMostrado = false;
  }

  function calcular() {
    const a = parseFloat(previo);
    const b = parseFloat(actual);
    if (operador === null || isNaN(a) || isNaN(b)) return;

    let resultado;
    switch (operador) {
      case '+': resultado = a + b; break;
      case '−': resultado = a - b; break;
      case '×': resultado = a * b; break;
      case '÷':
        if (b === 0) {
          actual = 'Error';
          previo = '';
          operador = null;
          resultadoMostrado = true;
          return;
        }
        resultado = a / b;
        break;
      default: return;
    }

    actual = String(Math.round((resultado + Number.EPSILON) * 1e10) / 1e10);
    previo = '';
    operador = null;
    resultadoMostrado = true;
  }

  function limpiar() {
    actual = '0';
    previo = '';
    operador = null;
    resultadoMostrado = false;
  }

  function borrarUltimo() {
    if (resultadoMostrado) {
      limpiar();
      return;
    }
    actual = actual.length > 1 ? actual.slice(0, -1) : '0';
  }

  function porcentaje() {
    actual = String(parseFloat(actual) / 100);
  }

  document.querySelectorAll('[data-numero]').forEach(boton => {
    boton.addEventListener('click', () => {
      ingresarNumero(boton.dataset.numero);
      actualizarPantalla();
    });
  });

  document.querySelectorAll('[data-operador]').forEach(boton => {
    boton.addEventListener('click', () => {
      elegirOperador(boton.dataset.operador);
      actualizarPantalla();
    });
  });

  document.querySelector('[data-accion="igual"]').addEventListener('click', () => {
    calcular();
    actualizarPantalla();
  });

  document.querySelector('[data-accion="limpiar"]').addEventListener('click', () => {
    limpiar();
    actualizarPantalla();
  });

  document.querySelector('[data-accion="borrar"]').addEventListener('click', () => {
    borrarUltimo();
    actualizarPantalla();
  });

  document.querySelector('[data-accion="porcentaje"]').addEventListener('click', () => {
    porcentaje();
    actualizarPantalla();
  });

  const mapaTeclas = { '*': '×', '/': '÷', '-': '−', '+': '+' };

  window.addEventListener('keydown', (evento) => {
    if (evento.key >= '0' && evento.key <= '9') {
      ingresarNumero(evento.key);
      actualizarPantalla();
    } else if (evento.key === '.') {
      ingresarNumero('.');
      actualizarPantalla();
    } else if (mapaTeclas[evento.key]) {
      elegirOperador(mapaTeclas[evento.key]);
      actualizarPantalla();
    } else if (evento.key === 'Enter' || evento.key === '=') {
      evento.preventDefault();
      calcular();
      actualizarPantalla();
    } else if (evento.key === 'Backspace') {
      borrarUltimo();
      actualizarPantalla();
    } else if (evento.key === 'Escape') {
      limpiar();
      actualizarPantalla();
    }
  });

  actualizarPantalla();
</script>

</body>
</html>
